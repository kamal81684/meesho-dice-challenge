<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyapar-AI Pricing</title>
<style>
  :root { --plum:#5b1a5e; --pink:#e5246b; --green:#1f9d55; --amber:#f59e0b; --bg:#fbf6fb;
          --card:#fff; --muted:#6b5b6e; --line:#ecdfee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:#2a1630; }
  header { background:linear-gradient(90deg,var(--plum),var(--pink)); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:20px; } header p { margin:2px 0 0; opacity:.85; font-size:13px; }
  main { max-width:1180px; margin:0 auto; padding:16px; display:grid; gap:16px;
         grid-template-columns: minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr); }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { font-size:15px; margin:0 0 12px; color:var(--plum); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .checks label { display:flex; gap:6px; align-items:center; color:#2a1630; font-size:13px; }
  .checks input { width:auto; }
  button { margin-top:14px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--pink);
           color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  .big { font-size:44px; font-weight:800; color:var(--plum); text-align:center; margin:4px 0; }
  .sub { text-align:center; color:var(--muted); font-size:13px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .stat { border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:20px; color:var(--plum); } .stat span { font-size:11px; color:var(--muted); }
  .spectrum { position:relative; height:12px; border-radius:6px; margin:28px 4px 8px;
              background:linear-gradient(90deg,#e11d48,#f59e0b 25%,#22c55e 50%,#f59e0b 75%,#e11d48); }
  .dot { position:absolute; top:-5px; width:22px; height:22px; border-radius:50%; background:var(--green);
         border:3px solid #fff; box-shadow:0 1px 4px #0004; transform:translateX(-50%); }
  .ticks { display:flex; justify-content:space-between; font-size:12px; }
  .ticks div { text-align:center; } .ticks b { display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:4px 0; border-bottom:1px dashed var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .warn { background:#fff1f2; color:#9f1239; border-radius:8px; padding:8px; font-size:13px; margin-top:10px; }
  .chat { background:#e9f5ec; border-radius:12px; padding:10px; min-height:200px; }
  .bubble { background:#fff; border-radius:10px; padding:10px; margin-bottom:10px; font-size:14px; line-height:1.4;
            box-shadow:0 1px 1px #0001; }
  .bubble .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .bubble .acts span { font-size:12px; padding:5px 8px; border-radius:6px; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; }
  .bubble .acts span:first-child { background:var(--green); color:#fff; border-color:var(--green); }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Vyapar-AI · Smart Pricing Assistant</h1>
  <p>Turn your product into profit with data-driven pricing</p>
</header>
<main>
  <section class="card">
    <h2>1 · Product details & costs (per unit)</h2>
    <form id="f">
      <label>Product title</label>
      <input name="title" value="Pink printed cotton kurti" required>
      <label>Sub-category</label>
      <select name="subcategory" id="sub"></select>
      <div class="row">
        <div><label>Fabric</label><select name="fabric">
          <option>cotton</option><option>rayon</option><option>silk</option><option>polyester</option><option>georgette</option><option>linen</option></select></div>
        <div><label>Pattern</label><select name="pattern">
          <option>printed</option><option>solid</option><option>embroidered</option><option>woven</option><option>striped</option><option>floral</option></select></div>
      </div>
      <div class="row">
        <div><label>Colour</label><select name="color">
          <option>pink</option><option>red</option><option>blue</option><option>green</option><option>yellow</option><option>black</option><option>white</option><option>purple</option><option>orange</option></select></div>
        <div><label>Weight (kg)</label><input name="weight_kg" type="number" step="0.01" value="0.35"></div>
      </div>
      <div class="row">
        <div><label>Fabric / product cost (₹)</label><input name="cogs" type="number" value="150" required></div>
        <div><label>Labour & stitching (₹)</label><input name="labor" type="number" value="20"></div>
      </div>
      <div class="row">
        <div><label>Packaging (₹)</label><input name="packaging" type="number" value="10"></div>
        <div><label>Target net profit (₹)</label><input name="target_profit" type="number" value="40"></div>
      </div>
      <div class="row">
        <div><label>Photos uploaded</label><input name="image_count" type="number" value="3"></div>
        <div><label>Your name</label><input name="seller_name" value="Ramesh"></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" name="has_size_chart"> Size chart added</label>
        <label><input type="checkbox" name="has_fabric_card"> Fabric/GSM card added</label>
      </div>
      <button id="go">Get launch price</button>
    </form>
  </section>

  <section class="card" id="result">
    <h2>2 · Recommended listing price</h2>
    <p class="muted">Fill in the form and press <b>Get launch price</b>.</p>
  </section>

  <section class="card">
    <h2>3 · WhatsApp nudges</h2>
    <div class="chat" id="chat"><p class="muted">Vyapar-AI Bot messages will appear here.</p></div>
  </section>
</main>
<script>
const rs = x => "₹" + Math.round(x).toLocaleString("en-IN");
const pct = x => (x * 100).toFixed(0) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("/api/subcategories").then(r => r.json()).then(t => {
  const sel = document.getElementById("sub");
  for (const [cat, subs] of Object.entries(t)) {
    const g = document.createElement("optgroup"); g.label = cat.replace("_", " ");
    subs.forEach(s => { const o = new Option(s.replaceAll("_", " "), s); g.appendChild(o); });
    sel.appendChild(g);
  }
  sel.value = "kurti";
});

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target), body = {};
  for (const [k, v] of fd.entries()) body[k] = v;
  for (const k of ["cogs","labor","packaging","target_profit","weight_kg","image_count"]) body[k] = Number(body[k] || 0);
  body.has_size_chart = fd.has("has_size_chart"); body.has_fabric_card = fd.has("has_fabric_card");
  const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Analysing market…";
  try {
    const r = await fetch("/api/day0", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    render(await r.json());
  } catch (err) {
    document.getElementById("result").innerHTML = `<h2>2 · Recommended listing price</h2><div class="warn">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Get launch price"; }
});

function render(d) {
  const rec = d.recommendation, m = d.market, k = d.risk, s = d.price_spectrum, c = d.cost_breakdown;
  const lo = s.loss_zone_below * 0.9, hi = Math.max(s.overpriced_above * 1.15, rec.recommended_price * 1.1);
  const pos = Math.min(100, Math.max(0, (rec.recommended_price - lo) / (hi - lo) * 100));
  document.getElementById("result").innerHTML = `
    <h2>2 · Recommended listing price</h2>
    <div class="big">${rs(rec.recommended_price)}</div>
    <div class="sub">Competitor band ${rs(m.band_low)} – ${rs(m.band_high)} (median ${rs(m.median_price)}) ·
      support: ${m.support} similar listings (${m.level})</div>
    <div class="stats">
      <div class="stat"><b>${pct(k.predicted_return_rate)}</b><span>Predicted return risk</span></div>
      <div class="stat"><b>${pct(k.predicted_rto_rate)}</b><span>Predicted RTO risk</span></div>
      <div class="stat"><b>${rs(rec.expected_unit_margin)}</b><span>Expected margin / order</span></div>
    </div>
    <div class="spectrum"><div class="dot" style="left:${pos}%"></div></div>
    <div class="ticks">
      <div style="color:#be123c"><b>${rs(s.loss_zone_below)}</b>Break-even<br>(loss below)</div>
      <div style="color:#15803d"><b>${rs(s.sweet_spot)}</b>Sweet spot</div>
      <div style="color:#be123c"><b>${rs(s.overpriced_above)}</b>Overpriced<br>(search drop-off)</div>
    </div>
    <h2 style="margin-top:18px">How we got here (P₀ floor = ${rs(rec.floor_price)})</h2>
    <table>
      <tr><td>Product cost</td><td>${rs(c.cogs)}</td></tr>
      <tr><td>Labour</td><td>${rs(c.labor)}</td></tr>
      <tr><td>Packaging</td><td>${rs(c.packaging)}</td></tr>
      <tr><td>Expected RTO cost (${pct(k.predicted_rto_rate)} × ${rs(c.c_rto)})</td><td>${rs(c.expected_rto_cost)}</td></tr>
      <tr><td>Expected return cost (${pct(k.predicted_return_rate)} × ${rs(c.c_damage)})</td><td>${rs(c.expected_return_cost)}</td></tr>
      <tr><td>Target profit</td><td>${rs(c.target_profit)}</td></tr>
      <tr><td>÷ (1 − GST/TCS/TDS ${pct(c.tax_rate)})</td><td><b>${rs(rec.floor_price)}</b></td></tr>
    </table>
    ${rec.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("")}
    <h2 style="margin-top:18px">Similar listings</h2>
    <table>${m.neighbours.map(n => `<tr><td>${esc(n.title)} <span class="muted">(RTO ${pct(n.rto_rate)})</span></td><td>${rs(n.price)}</td></tr>`).join("")}</table>`;
  document.getElementById("chat").innerHTML = d.nudges.map(n => `
    <div class="bubble">${esc(n.text)}
      <div class="acts">${n.actions.map(a => `<span>${esc(a)}</span>`).join("")}</div></div>`).join("");
}
</script>
</body>
</html>
